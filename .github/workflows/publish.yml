name: Quarto Publish
on:
  workflow_dispatch:
  push:
    branches: main
  schedule:
    - cron: "0 * * * *"
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1
      - name: Fetch and save data
        run: |
          git pull --rebase origin main
          Rscript -e "
            library(httr2)
            library(data.table)
            library(arrow)
            library(dplyr)
            library(lubridate)
            library(rlang)
            source('R/data.R')
            charger_donnees()
          "
      - name: Commit updated parquet
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add inputs/donnees.parquet
          git diff --staged --quiet || git commit -m "chore: update donnees.parquet [skip ci]"
          git push
      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: index.qmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}